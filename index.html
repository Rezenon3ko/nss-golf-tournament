<!doctype html>
<html lang="zh-CN" class="style-basic">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <title>鬼吃鱼高尔夫锦标赛</title>

    <meta name="description" content="NSS 鬼吃鱼高尔夫锦标赛 - 比赛记录与积分榜" />
    <meta name="theme-color" content="#ffffff" />

    <!-- 首屏渲染前应用主题，避免深色模式闪白（与 stores/darkMode.js 使用同一个存储键） -->
    <script>
      ;(function () {
        try {
          var dark = localStorage.getItem('darkMode') === '1'
          if (dark) document.documentElement.classList.add('dark', 'dark-scrollbars-compat')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#121212' : '#ffffff')
        } catch (err) {
          // 隐私模式等无法访问 localStorage 的场景忽略即可
        }
      })()
    </script>
  </head>
  <body>
    <noscript>
      <strong>本站需要启用 JavaScript 才能正常使用。</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- built files will be auto injected -->
  </body>
</html>
